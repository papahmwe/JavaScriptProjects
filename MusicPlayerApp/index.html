<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player App</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://kit.fontawesome.com/bae0ff5be9.js" crossorigin="anonymous"></script>

</head>

<body>

    <div class="container">
        <div class="music-player">
            <nav>
                <div class="circle">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
                <div class="circle">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>

            <img src="./music.png" alt="song-img" class="song-img">

            <h1 id="title"></h1>
            <p id="singer"></p>

            <audio id="song">
                <source src="" type="audio/mpeg">
            </audio>

            <input type="range" value="0" id="progress" />

            <div class="controls">
                <div onclick="playPrevious()"><i class="fa-solid fa-backward"></i></div>
                <div onclick="playPause()"><i class="fa-solid fa-play" id="controlsIcon"></i></div>
                <div onclick="playNext()"><i class="fa-solid fa-forward"></i></div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
